# Автономный пакет мониторинга и базовой настройки BQ25895.
#
# Пакет подключается основной прошивкой после объявления I2C:
#
#   i2c:
#     sda: ...
#     scl: ...
#
# Токи указаны в мА, напряжения — в мВ.
# Для аккумулятора 503759 PL, 1300 мА·ч выбран заряд около 0.5C:
# 640 мА. Максимальный ток 5 А из datasheet здесь намеренно не используется.

script:
  - id: battery_enter_shutdown
    mode: single
    then:
      - logger.log: "Критический разряд — колонка переходит в глубокий сон"
      - light.turn_on:
          id: status_ring
          red: 100%
          green: 0%
          blue: 0%
          brightness: 35%
      - delay: 2s
      - deep_sleep.enter:
          id: battery_shutdown_sleep

bq25895:
  id: battery_controller
  address: 0x6A
  update_interval: 10s

  # Параметры, записываемые в BQ25895 при старте.
  input_current_limit: 1000
  charge_current: 640
  charge_voltage: 4208
  precharge_current: 128
  termination_current: 128
  charge_enabled: true

  # Информационный параметр аккумулятора. BQ25895 не измеряет остаточную
  # ёмкость напрямую; процент ниже оценивается по напряжению.
  battery_capacity: 1300
  # Пороги синхронизированы с firmware/data/settings.json.
  warning_percent: 25
  critical_percent: 10
  shutdown_percent: 5

  battery_voltage:
    name: "Напряжение аккумулятора B1"
    id: battery_voltage
  system_voltage:
    name: "Системное напряжение B2"
    id: battery_system_voltage
  input_voltage:
    name: "Входное напряжение зарядки B3"
    id: battery_input_voltage
  charge_current_sensor:
    name: "Ток заряда B4"
    id: battery_charge_current
  input_current_limit_sensor:
    name: "Ограничение входного тока B5"
    id: battery_input_current_limit
  battery_percent:
    name: "Оценка заряда аккумулятора B6"
    id: battery_percent
  temperature_adc:
    name: "Уровень NTC BQ25895 B7"
    id: battery_ntc_level

  charging:
    name: "Аккумулятор заряжается C1"
    id: battery_is_charging
  power_good:
    name: "Питание зарядки доступно C2"
    id: battery_power_good
    on_release:
      - delay: 1s
      - if:
          condition:
            lambda: return id(battery_shutdown).state && !id(battery_is_charging).state && !id(battery_power_good).state;
          then:
            - script.execute: battery_enter_shutdown
  battery_full:
    name: "Аккумулятор заряжен C3"
    id: battery_full
  boost_active:
    name: "Повышающий преобразователь активен C4"
    id: battery_boost_active
  charger_fault:
    name: "Ошибка контроллера батареи C5"
    id: battery_charger_fault
  battery_low:
    name: "Низкий заряд аккумулятора C6"
    id: battery_low
  battery_critical:
    name: "Критический заряд аккумулятора C7"
    id: battery_critical
  battery_shutdown:
    name: "Требуется отключение по разряду C8"
    id: battery_shutdown
    on_press:
      - if:
          condition:
            lambda: return id(battery_power_good).state || id(battery_is_charging).state;
          then:
            - logger.log: "Порог отключения достигнут, но зарядка доступна — отключение отложено"
          else:
            - script.execute: battery_enter_shutdown

  charge_status:
    name: "Статус зарядки T1"
    id: battery_charge_status
  fault_status:
    name: "Статус ошибки зарядки T2"
    id: battery_fault_status

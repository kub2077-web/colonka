# Умная колонка ESP32-S3
#
# Связный каркас состояний. Подключается из основного YAML через:
#
# packages:
#   state_machine: !include state-machine.yaml
#
# Важное правило: этот пакет хранит состояние и маршрутизирует события.
# Реализация радио, SD-плеера и сами microWakeWord-модели находятся в основном
# YAML. Идентификаторы моделей, используемые ниже, определены там же.
# Функциональные модули должны реагировать на события, а не менять состояния
# связи и голоса напрямую.

globals:
  # Состояние связи:
  # 0 = нет сети
  # 1 = есть только Wi‑Fi
  # 2 = Home Assistant доступен
  - id: sm_connectivity_state
    type: int
    restore_value: no
    initial_value: "0"

  # Голосовая сессия:
  # 0 = ожидание
  # 1 = локальное окно команд
  # 2 = удалённая передача аудио
  - id: sm_voice_state
    type: int
    restore_value: no
    initial_value: "0"

  # Источник воспроизведения:
  # 0 = нет источника
  # 1 = радио
  # 2 = SD
  - id: sm_playback_source
    type: int
    restore_value: no
    initial_value: "0"

  # Состояние воспроизведения:
  # 0 = остановлено
  # 1 = запуск
  # 2 = воспроизводится
  # 3 = ошибка
  # 4 = пауза
  - id: sm_playback_state
    type: int
    restore_value: no
    initial_value: "0"

  # Общая локальная громкость. Радио использует диапазон 0..1,
  # SD-плеер преобразует его в свой диапазон усиления.
  - id: sm_volume_level
    type: float
    # Громкость намеренно не сохраняется во flash. При старте используется
    # безопасный фиксированный уровень, чтобы изменение громкости на низком
    # заряде не инициировало запись в EEPROM/Preferences.
    restore_value: no
    initial_value: "0.30"

  # Владелец общего аудиовыхода:
  # 0 = свободен, 1 = радио, 2 = SD, 3 = голосовая сессия.
  - id: sm_audio_owner
    type: int
    restore_value: no
    initial_value: "0"

  # Источник, который нужно вернуть после завершения голосовой сессии.
  - id: sm_audio_previous_owner
    type: int
    restore_value: no
    initial_value: "0"

  # Временное значение для перехода между владельцами.
  - id: sm_audio_transition_from
    type: int
    restore_value: no
    initial_value: "0"

  # Голосовые команды:
  # 0 = радио
  # 1 = память
  # 2 = назад
  # 3 = дальше
  # 4 = громче
  # 5 = тише
  # 6 = стоп
  - id: sm_last_voice_command
    type: int
    restore_value: no
    initial_value: "-1"

  # Следующую голосовую сессию предпочтительно передать в Home Assistant.
  # Флаг отделён от текущей сессии: восстановление сети не должно прерывать
  # локальную команду или текущий трек.
  - id: sm_remote_preferred
    type: bool
    restore_value: no
    initial_value: "false"

  # Устанавливаются модулями радио/SD после получения команды маршрутизатора.
  - id: sm_next_requested
    type: bool
    restore_value: no
    initial_value: "false"

  - id: sm_previous_requested
    type: bool
    restore_value: no
    initial_value: "false"

  - id: sm_stop_requested
    type: bool
    restore_value: no
    initial_value: "false"

text_sensor:
  - platform: template
    id: sm_connectivity_text
    name: "Состояние соединения 10"
    update_interval: never

  - platform: template
    id: sm_voice_state_text
    name: "Состояние голоса 11"
    update_interval: never

  - platform: template
    id: sm_playback_state_text
    name: "Состояние воспроизведения 12"
    update_interval: never

  - platform: template
    id: sm_audio_owner_text
    name: "Владелец аудиовыхода 14"
    update_interval: never

  - platform: template
    id: sm_last_voice_command_text
    name: "Последняя голосовая команда 13"
    update_interval: never

script:
  # --------------------------------------------------------------------------
  # Публикация состояний
  # --------------------------------------------------------------------------

  - id: sm_publish_states
    mode: restart
    then:
      - lambda: |-
          const char *connectivity = "Нет сети";
          if (id(sm_connectivity_state) == 1) {
            connectivity = "Только Wi‑Fi";
          } else if (id(sm_connectivity_state) == 2) {
            connectivity = "Home Assistant доступен";
          }

          const char *voice = "Ожидание";
          if (id(sm_voice_state) == 1) {
            voice = "Локальное окно команд";
          } else if (id(sm_voice_state) == 2) {
            voice = "Удалённое аудио";
          }

          const char *playback = "Остановлено";
          if (id(sm_playback_state) == 1) {
            playback = "Запуск";
          } else if (id(sm_playback_state) == 2) {
            playback = "Воспроизводится";
          } else if (id(sm_playback_state) == 3) {
            playback = "Ошибка";
          } else if (id(sm_playback_state) == 4) {
            playback = "Пауза";
          }

          const char *audio_owner = "Свободен";
          if (id(sm_audio_owner) == 1) {
            audio_owner = "Радио";
          } else if (id(sm_audio_owner) == 2) {
            audio_owner = "SD";
          } else if (id(sm_audio_owner) == 3) {
            audio_owner = "Голосовая сессия";
          }

          id(sm_connectivity_text).publish_state(connectivity);
          id(sm_voice_state_text).publish_state(voice);
          id(sm_playback_state_text).publish_state(playback);
          id(sm_audio_owner_text).publish_state(audio_owner);

  # --------------------------------------------------------------------------
  # Арбитр общего аудиовыхода
  # --------------------------------------------------------------------------

  - id: sm_audio_acquire
    mode: restart
    parameters:
      requested_owner: int
    then:
      - if:
          condition:
            lambda: return id(sm_audio_owner) != requested_owner;
          then:
            # Запоминаем старого владельца до остановки его движка.
            - lambda: |-
                id(sm_audio_transition_from) = id(sm_audio_owner);
                if (requested_owner == 3) {
                  id(sm_audio_previous_owner) = id(sm_audio_owner);
                }
                id(sm_audio_owner) = requested_owner;
            - if:
                condition:
                  lambda: return id(sm_audio_transition_from) == 1;
                then:
                  - script.execute: radio_apply_stop
            - if:
                condition:
                  lambda: return id(sm_audio_transition_from) == 2;
                then:
                  - script.execute: sd_apply_stop
            - if:
                condition:
                  lambda: return id(sm_audio_transition_from) == 3;
                then:
                  - voice_assistant.stop:
            - script.execute: sm_publish_states

  - id: sm_audio_release_voice
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(sm_audio_owner) == 3;
          then:
            # Сначала освобождаем owner, чтобы возобновляющий скрипт не
            # воспринял собственный запуск как конфликт владельцев.
            - lambda: id(sm_audio_owner) = 0;
            - if:
                condition:
                  lambda: return id(sm_audio_previous_owner) == 1;
                then:
                  - script.execute: radio_start
            - if:
                condition:
                  lambda: return id(sm_audio_previous_owner) == 2;
                then:
                  - script.execute: sd_start
            - lambda: id(sm_audio_previous_owner) = 0;
            - script.execute: sm_publish_states

  # --------------------------------------------------------------------------
  # Переходы состояния связи
  # --------------------------------------------------------------------------

  - id: sm_enter_offline
    mode: restart
    then:
      - lambda: |-
          id(sm_connectivity_state) = 0;
          id(sm_remote_preferred) = false;
      - if:
          condition:
            lambda: return id(sm_voice_state) == 2;
          then:
            - voice_assistant.stop:
            - lambda: |-
                id(sm_voice_state) = 0;
            - script.execute: sm_restore_idle_wake_word
      - script.execute: sm_publish_states
      - logger.log: "Состояния: нет сети; локальная работа доступна"

  - id: sm_enter_wifi_only
    mode: restart
    then:
      - lambda: |-
          id(sm_connectivity_state) = 1;
          id(sm_remote_preferred) = false;
      - script.execute: sm_publish_states
      - logger.log: "Состояния: только Wi‑Fi; доступны локальный голос и интернет-радио"

  - id: sm_enter_home_assistant_ready
    mode: restart
    then:
      - lambda: |-
          id(sm_connectivity_state) = 2;
          id(sm_remote_preferred) = true;
      - script.execute: sm_publish_states
      - logger.log: "Состояния: Home Assistant доступен; удалённое аудио предпочтительно"

  - id: sm_on_wifi_connected
    mode: restart
    then:
      - script.execute: sm_enter_wifi_only
      - if:
          condition:
            api.connected:
          then:
            - script.execute: sm_enter_home_assistant_ready

  - id: sm_on_wifi_disconnected
    mode: restart
    then:
      - script.execute: sm_enter_offline

  - id: sm_on_api_connected
    mode: restart
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: sm_enter_home_assistant_ready
          else:
            - script.execute: sm_enter_offline

  - id: sm_on_api_disconnected
    mode: restart
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: sm_enter_wifi_only
          else:
            - script.execute: sm_enter_offline

  # Это только редкая проверка согласованности. Сканирования Wi‑Fi здесь нет.
  # За попытки переподключения отвечает компонент Wi‑Fi ESPHome, который
  # вызывает события выше. Интервал нужен как страховка при пропущенном событии.
  - id: sm_reconcile_connectivity
    mode: restart
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - if:
                condition:
                  api.connected:
                then:
                  - script.execute: sm_enter_home_assistant_ready
                else:
                  - script.execute: sm_enter_wifi_only
          else:
            - script.execute: sm_enter_offline

  # --------------------------------------------------------------------------
  # Переходы голосовой сессии
  # --------------------------------------------------------------------------

  - id: sm_open_local_command_window
    mode: restart
    then:
      - script.execute:
          id: sm_audio_acquire
          requested_owner: 3
      - if:
          condition:
            lambda: return id(sm_voice_state) == 2;
          then:
            - voice_assistant.stop:
      - lambda: |-
          id(sm_voice_state) = 1;
      - script.execute: sm_enable_local_command_models
      - script.execute: sm_publish_states
      - logger.log: "Состояния: открыто локальное окно команд"
      - script.execute: sm_local_command_window_timeout

  - id: sm_enable_local_command_models
    mode: restart
    then:
      - micro_wake_word.disable_model: wake_word_skadi
      - micro_wake_word.enable_model: wake_word_radio
      - micro_wake_word.enable_model: wake_word_pamyat
      - micro_wake_word.enable_model: wake_word_nazad
      - micro_wake_word.enable_model: wake_word_dalshe
      - micro_wake_word.enable_model: wake_word_gromche
      - micro_wake_word.enable_model: wake_word_tishe
      - micro_wake_word.enable_model: wake_word_stop
      - micro_wake_word.start:

  - id: sm_restore_idle_wake_word
    mode: restart
    then:
      - script.stop: sm_local_command_window_timeout
      - micro_wake_word.disable_model: wake_word_radio
      - micro_wake_word.disable_model: wake_word_pamyat
      - micro_wake_word.disable_model: wake_word_nazad
      - micro_wake_word.disable_model: wake_word_dalshe
      - micro_wake_word.disable_model: wake_word_gromche
      - micro_wake_word.disable_model: wake_word_tishe
      - micro_wake_word.disable_model: wake_word_stop
      - micro_wake_word.enable_model: wake_word_skadi
      - if:
          condition:
            lambda: return !id(microphone_privacy);
          then:
            - micro_wake_word.start:
      - lambda: |-
          id(sm_voice_state) = 0;
      - script.execute: sm_publish_states
      - script.execute: sm_audio_release_voice

  - id: sm_local_command_window_timeout
    mode: restart
    then:
      - delay: 8s
      - if:
          condition:
            lambda: return id(sm_voice_state) == 1;
          then:
            - logger.log: "Состояния: локальное окно команд закрыто по тайм-ауту"
            - script.execute: sm_restore_idle_wake_word

  - id: sm_start_voice_session
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(sm_remote_preferred) &&
                     id(sm_connectivity_state) == 2;
          then:
            - if:
                condition:
                  voice_assistant.connected:
                then:
                  - script.execute:
                      id: sm_audio_acquire
                      requested_owner: 3
                  - lambda: |-
                      id(sm_voice_state) = 2;
                  - script.execute: sm_publish_states
                  - voice_assistant.start:
                      wake_word: !lambda 'return std::string("Скади");'
                else:
                  - script.execute: sm_open_local_command_window
          else:
            - script.execute: sm_open_local_command_window

  - id: sm_voice_session_finished
    mode: restart
    then:
      - script.execute: sm_restore_idle_wake_word
      - logger.log: "Состояния: голосовая сессия завершена"

  - id: sm_voice_remote_failed
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(sm_voice_state) == 2;
          then:
            - voice_assistant.stop:
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: sm_enter_wifi_only
          else:
            - script.execute: sm_enter_offline
      - script.execute: sm_open_local_command_window
      - logger.log: "Состояния: удалённый голос недоступен; переход к локальным командам"

  # --------------------------------------------------------------------------
  # Маршрутизация команд воспроизведения
  # --------------------------------------------------------------------------

  - id: sm_route_next
    mode: restart
    then:
      - lambda: |-
          id(sm_next_requested) = true;
          id(sm_previous_requested) = false;
      - if:
          condition:
            lambda: return id(sm_playback_source) == 1;
          then:
            - logger.log: "Маршрутизатор: Дальше → поиск следующей радиостанции"
          else:
            - if:
                condition:
                  lambda: return id(sm_playback_source) == 2;
                then:
                  - logger.log: "Маршрутизатор: Дальше → следующий рабочий трек SD"
                else:
                  - logger.log: "Маршрутизатор: Дальше пропущена; источник не выбран"

  - id: sm_route_previous
    mode: restart
    then:
      - lambda: |-
          id(sm_previous_requested) = true;
          id(sm_next_requested) = false;
      - if:
          condition:
            lambda: return id(sm_playback_source) == 1;
          then:
            - logger.log: "Маршрутизатор: Назад → предыдущая радиостанция"
          else:
            - if:
                condition:
                  lambda: return id(sm_playback_source) == 2;
                then:
                  - logger.log: "Маршрутизатор: Назад → предыдущий рабочий трек SD"
                else:
                  - logger.log: "Маршрутизатор: Назад пропущена; источник не выбран"

  - id: sm_route_stop
    mode: restart
    then:
      - lambda: |-
          id(sm_stop_requested) = true;
          id(sm_playback_state) = 0;
      - script.execute: sm_publish_states
      - logger.log: "Маршрутизатор: Стоп"

  - id: sm_route_pause
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(sm_playback_source) == 1;
          then:
            - script.execute: radio_pause
          else:
            - if:
                condition:
                  lambda: return id(sm_playback_source) == 2;
                then:
                  - script.execute: sd_pause
                else:
                  - logger.log: "Маршрутизатор: Пауза пропущена; источник не выбран"

  - id: sm_select_radio_source
    mode: restart
    then:
      - script.execute: radio_start

  - id: sm_select_sd_source
    mode: restart
    then:
      - script.execute: sd_start

  - id: sm_toggle_playback_source
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(sm_playback_source) == 1;
          then:
            - script.execute: sm_select_sd_source
          else:
            - script.execute: sm_select_radio_source
      - logger.log: "Маршрутизатор: длинная пауза — переключение радио/SD"

  - id: sm_apply_volume
    mode: restart
    parameters:
      delta: float
    then:
      - lambda: |-
          id(sm_volume_level) += delta;
          if (id(sm_volume_level) < 0.0f) {
            id(sm_volume_level) = 0.0f;
          }
          if (id(sm_volume_level) > 1.0f) {
            id(sm_volume_level) = 1.0f;
          }
      - if:
          condition:
            lambda: return id(sm_playback_source) == 1;
          then:
            - media_player.volume_set:
                id: radio_media_player
                volume: !lambda "return id(sm_volume_level);"
          else:
            - if:
                condition:
                  lambda: return id(sm_playback_source) == 2;
                then:
                  - script.execute:
                      id: sd_set_volume
                      volume: !lambda "return id(sm_volume_level);"
      - logger.log:
          format: "Маршрутизатор: громкость %.0f%%"
          args: ["id(sm_volume_level) * 100.0f"]

  - id: sm_volume_up
    mode: restart
    then:
      - script.execute:
          id: sm_apply_volume
          delta: 0.05

  - id: sm_volume_down
    mode: restart
    then:
      - script.execute:
          id: sm_apply_volume
          delta: -0.05

  - id: sm_route_voice_command
    mode: restart
    parameters:
      command: int
    then:
      - lambda: |-
          id(sm_last_voice_command) = command;
          const char *command_name = "Неизвестная";
          if (command == 0) {
            command_name = "Радио";
          } else if (command == 1) {
            command_name = "Память";
          } else if (command == 2) {
            command_name = "Назад";
          } else if (command == 3) {
            command_name = "Дальше";
          } else if (command == 4) {
            command_name = "Громче";
          } else if (command == 5) {
            command_name = "Тише";
          } else if (command == 6) {
            command_name = "Стоп";
          }
          id(sm_last_voice_command_text).publish_state(command_name);
      - if:
          condition:
            lambda: return command == 0;
          then:
            - script.execute: sm_select_radio_source
          else:
            - if:
                condition:
                  lambda: return command == 1;
                then:
                  - script.execute: sm_select_sd_source
                else:
                  - if:
                      condition:
                        lambda: return command == 3;
                      then:
                        - script.execute: sm_route_next
                      else:
                        - if:
                            condition:
                              lambda: return command == 2;
                            then:
                              - script.execute: sm_route_previous
                            else:
                              - if:
                                  condition:
                                    lambda: return command == 6;
                                  then:
                                    - script.execute: sm_route_stop
                                  else:
                                    - if:
                                        condition:
                                          lambda: return command == 4;
                                        then:
                                          - script.execute: sm_volume_up
                                        else:
                                          - if:
                                              condition:
                                                lambda: return command == 5;
                                              then:
                                                - script.execute: sm_volume_down
                                              else:
                                                - logger.log: "Голосовой маршрутизатор: неизвестная команда"
      - script.execute: sm_restore_idle_wake_word

  - id: sm_handle_wake_word
    mode: restart
    parameters:
      wake_word: string
    then:
      - if:
          condition:
            lambda: return wake_word == "Скади";
          then:
            - script.execute: sm_start_voice_session
          else:
            - if:
                condition:
                  lambda: return wake_word == "Радио";
                then:
                  - script.execute:
                      id: sm_route_voice_command
                      command: 0
                else:
                  - if:
                      condition:
                        lambda: return wake_word == "Память";
                      then:
                        - script.execute:
                            id: sm_route_voice_command
                            command: 1
                      else:
                        - if:
                            condition:
                              lambda: return wake_word == "Назад";
                            then:
                              - script.execute:
                                  id: sm_route_voice_command
                                  command: 2
                            else:
                              - if:
                                  condition:
                                    lambda: return wake_word == "Дальше";
                                  then:
                                    - script.execute:
                                        id: sm_route_voice_command
                                        command: 3
                                  else:
                                    - if:
                                        condition:
                                          lambda: return wake_word == "Громче";
                                        then:
                                          - script.execute:
                                              id: sm_route_voice_command
                                              command: 4
                                        else:
                                          - if:
                                              condition:
                                                lambda: return wake_word == "Тише";
                                              then:
                                                - script.execute:
                                                    id: sm_route_voice_command
                                                    command: 5
                                              else:
                                                - if:
                                                    condition:
                                                      lambda: return wake_word == "Стоп";
                                                    then:
                                                      - script.execute:
                                                          id: sm_route_voice_command
                                                          command: 6
                                                    else:
                                                      - logger.log: "Голосовой маршрутизатор: неизвестное wake word"

  # Точки передачи управления модулям радио и SD.
  # Модули принимают запрос и затем очищают соответствующий флаг.
  - id: sm_set_radio_source
    mode: restart
    then:
      - lambda: |-
          id(sm_playback_source) = 1;
          id(sm_playback_state) = 1;
      - script.execute: sm_publish_states
      - logger.log: "Источник воспроизведения: радио"

  - id: sm_set_sd_source
    mode: restart
    then:
      - lambda: |-
          id(sm_playback_source) = 2;
          id(sm_playback_state) = 1;
      - script.execute: sm_publish_states
      - logger.log: "Источник воспроизведения: SD"

  - id: sm_playback_started
    mode: restart
    then:
      - lambda: |-
          id(sm_playback_state) = 2;
      - script.execute: sm_publish_states

  - id: sm_playback_paused
    mode: restart
    then:
      - lambda: |-
          id(sm_playback_state) = 4;
      - script.execute: sm_publish_states

  - id: sm_playback_failed
    mode: restart
    then:
      - lambda: |-
          id(sm_playback_state) = 3;
      - script.execute: sm_publish_states
      - logger.log: "Модуль воспроизведения сообщил об ошибочном элементе"

interval:
  - interval: 5min
    then:
      - script.execute: sm_reconcile_connectivity

wifi:
  reboot_timeout: 0s
  on_connect:
    - script.execute: sm_on_wifi_connected
  on_disconnect:
    - script.execute: sm_on_wifi_disconnected

api:
  reboot_timeout: 0s
  on_client_connected:
    - script.execute: sm_on_api_connected
  on_client_disconnected:
    - script.execute: sm_on_api_disconnected
    turn_off_action:
      - script.execute: radio_station_settings_changed

  - platform: template
    id: radio_station_6_enabled
    name: "Радиостанция 6 — включена"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: radio_station_settings_changed
    turn_off_action:
      - script.execute: radio_station_settings_changed

speaker:
  # The media and announcement pipelines are separate inputs, but both feed
  # the physical speaker declared by the base configuration. Playback remains
  # exclusive with the voice assistant until a dedicated ducking policy is
  # enabled.
  - platform: mixer
    id: radio_output_mixer
    output_speaker: voice_speaker
    source_speakers:
      - id: radio_media_mixer_input
      - id: radio_announcement_mixer_input

media_player:
  - platform: speaker
    id: radio_media_player
    name: "Локальное радио"
    media_pipeline:
      speaker: radio_media_mixer_input
      format: MP3
      sample_rate: 16000
      num_channels: 1
    announcement_pipeline:
      speaker: radio_announcement_mixer_input
      format: MP3
      sample_rate: 16000
      num_channels: 1
    buffer_size: 1000000
    task_stack_in_psram: true
    on_play:
      - script.execute: radio_on_play
    on_idle:
      - if:
          condition:
            lambda: return !id(radio_stop_expected) && !id(radio_paused);
          then:
            - script.execute: radio_on_stream_failed

script:
  - id: radio_station_settings_changed
    mode: restart
    then:
      - script.execute: radio_refresh_station_index
      - script.execute: radio_load_current_station

  - id: radio_refresh_station_index
    mode: restart
    then:
      - lambda: |-
          const radio_station_store::StationSlot stations[] = {
              {"nashe", id(radio_station_1_name).state,
               id(radio_station_1_url).state,
               id(radio_station_1_enabled).state},
              {"dacha", id(radio_station_2_name).state,
               id(radio_station_2_url).state,
               id(radio_station_2_enabled).state},
              {"rodnyh-dorog", id(radio_station_3_name).state,
               id(radio_station_3_url).state,
               id(radio_station_3_enabled).state},
              {"europa-plus", id(radio_station_4_name).state,
               id(radio_station_4_url).state,
               id(radio_station_4_enabled).state},
              {"marusya", id(radio_station_5_name).state,
               id(radio_station_5_url).state,
               id(radio_station_5_enabled).state},
              {"retro-fm", id(radio_station_6_name).state,
               id(radio_station_6_url).state,
               id(radio_station_6_enabled).state}};
          const int count = radio_station_store::enabled_count(
              stations, sizeof(stations) / sizeof(stations[0]));
          id(radio_station_count) = count;
          if (count <= 0) {
            id(radio_current_station) = 0;
          } else if (id(radio_current_station) >= count) {
            id(radio_current_station) = 0;
          }

  - id: radio_load_current_station
    mode: restart
    then:
      - lambda: |-
          const radio_station_store::StationSlot stations[] = {
              {"nashe", id(radio_station_1_name).state,
               id(radio_station_1_url).state,
               id(radio_station_1_enabled).state},
              {"dacha", id(radio_station_2_name).state,
               id(radio_station_2_url).state,
               id(radio_station_2_enabled).state},
              {"rodnyh-dorog", id(radio_station_3_name).state,
               id(radio_station_3_url).state,
               id(radio_station_3_enabled).state},
              {"europa-plus", id(radio_station_4_name).state,
               id(radio_station_4_url).state,
               id(radio_station_4_enabled).state},
              {"marusya", id(radio_station_5_name).state,
               id(radio_station_5_url).state,
               id(radio_station_5_enabled).state},
              {"retro-fm", id(radio_station_6_name).state,
               id(radio_station_6_url).state,
               id(radio_station_6_enabled).state}};
          radio_station_store::Station station;
          const bool loaded = radio_station_store::get_enabled_station(
              stations, sizeof(stations) / sizeof(stations[0]),
              id(radio_current_station), station);
          if (!loaded) {
            id(radio_current_station_url).clear();
            id(radio_current_station_name).publish_state("Нет станций");
            return;
          }
          id(radio_current_station_url) = station.url;
          id(radio_current_station_name).publish_state(station.name);

  - id: radio_publish_status
    mode: restart
    parameters:
      state: string
    then:
      - text_sensor.template.publish:
          id: radio_status
          state: !lambda "return state;"

  - id: radio_start
    mode: restart
    then:
      - script.execute:
          id: sm_audio_acquire
          requested_owner: 1
      - lambda: |-
          id(radio_stop_expected) = true;
          id(radio_paused) = false;
          id(sm_stop_requested) = false;
          id(radio_connecting) = false;
      - media_player.stop:
          id: radio_media_player
      - script.execute: sm_set_radio_source
      - media_player.volume_set:
          id: radio_media_player
          volume: !lambda "return id(sm_volume_level);"
      - script.execute: radio_refresh_station_index
      - script.execute: radio_load_current_station
      - lambda: |-
          id(radio_stop_expected) = false;
          id(radio_connecting) = true;
          id(radio_connect_deadline) = millis() + 15000;
      - script.execute:
          id: radio_publish_status
          state: "Подключение"
      - if:
          condition:
            lambda: return !id(radio_current_station_url).empty();
          then:
            - media_player.play_media:
                id: radio_media_player
                media_url: !lambda "return id(radio_current_station_url);"
          else:
            - lambda: id(radio_connecting) = false;
            - script.execute: sm_playback_failed
            - script.execute:
                id: radio_publish_status
                state: "Нет доступных станций"

  - id: radio_apply_stop
    mode: restart
    then:
      - lambda: |-
          id(radio_stop_expected) = true;
          id(radio_paused) = false;
          id(sm_stop_requested) = false;
          id(radio_connecting) = false;
          if (id(sm_audio_owner) == 1) {
            id(sm_audio_owner) = 0;
          }
      - media_player.stop:
          id: radio_media_player
      - script.execute:
          id: radio_publish_status
          state: "Остановлено"

  - id: radio_pause
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(radio_paused);
          then:
            - media_player.play:
                id: radio_media_player
            - lambda: id(radio_paused) = false;
            - script.execute: sm_playback_started
            - script.execute:
                id: radio_publish_status
                state: "Воспроизводится"
          else:
            - media_player.pause:
                id: radio_media_player
            - lambda: id(radio_paused) = true;
            - script.execute: sm_playback_paused
            - script.execute:
                id: radio_publish_status
                state: "Пауза"

  - id: radio_request_stop
    mode: restart
    then:
      - script.execute: sm_route_stop
      - script.execute: radio_apply_stop

  - id: radio_on_play
    mode: restart
    then:
      - lambda: |-
          id(radio_connecting) = false;
          id(radio_paused) = false;
          id(radio_failed_attempts) = 0;
      - script.execute: sm_playback_started
      - script.execute:
          id: radio_publish_status
          state: "Воспроизводится"

  - id: radio_on_stream_failed
    mode: restart
    then:
      - lambda: |-
          id(radio_connecting) = false;
          if (id(sm_audio_owner) == 1) {
            id(sm_audio_owner) = 0;
          }
      - if:
          condition:
            lambda: |-
              return id(radio_station_count) > 0 &&
                     id(radio_failed_attempts) < id(radio_station_count) - 1;
          then:
            - lambda: |-
                id(radio_failed_attempts)++;
                id(radio_current_station) =
                    (id(radio_current_station) + 1) % id(radio_station_count);
            - logger.log: "Радио: поток не отвечает, переход к следующей станции"
            - script.execute: radio_start
          else:
            - lambda: id(radio_failed_attempts) = 0;
            - script.execute: sm_playback_failed
            - script.execute:
                id: radio_publish_status
                state: "Нет рабочей станции"

  - id: radio_next
    mode: restart
    then:
      - lambda: id(radio_failed_attempts) = 0;
      - lambda: |-
          if (id(radio_station_count) > 0) {
            id(radio_current_station) =
                (id(radio_current_station) + 1) % id(radio_station_count);
          }
      - script.execute: radio_start

  - id: radio_previous
    mode: restart
    then:
      - lambda: id(radio_failed_attempts) = 0;
      - lambda: |-
          if (id(radio_station_count) > 0) {
            id(radio_current_station) =
                (id(radio_current_station) + id(radio_station_count) - 1) %
                id(radio_station_count);
          }
      - script.execute: radio_start

  # The state machine sets request flags. This package consumes only requests
  # belonging to the radio source, so an SD module can use the same flags.
  - id: radio_consume_router_requests
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(sm_playback_source) == 1 &&
                     id(sm_next_requested);
          then:
            - lambda: id(sm_next_requested) = false;
            - script.execute: radio_next
      - if:
          condition:
            lambda: |-
              return id(sm_playback_source) == 1 &&
                     id(sm_previous_requested);
          then:
            - lambda: id(sm_previous_requested) = false;
            - script.execute: radio_previous
      - if:
          condition:
            lambda: |-
              return id(sm_playback_source) == 1 &&
                     id(sm_stop_requested);
          then:
            - script.execute: radio_apply_stop

  - id: radio_bootstrap
    mode: restart
    then:
      - script.execute: radio_refresh_station_index
      - script.execute: radio_load_current_station
      - script.execute:
          id: radio_publish_status
          state: "Остановлено"

interval:
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              return id(radio_connecting) &&
                     static_cast<int32_t>(millis() - id(radio_connect_deadline)) >= 0;
          then:
            - logger.log: "Радио: тайм-аут подключения станции"
            - script.execute: radio_on_stream_failed
      - script.execute: radio_consume_router_requests

button:
  - platform: template
    name: "Запустить радио 60"
    id: radio_start_button
    on_press:
      - lambda: id(radio_failed_attempts) = 0;
      - script.execute: radio_start

  - platform: template
    name: "Остановить радио 61"
    id: radio_stop_button
    on_press:
      - script.execute: radio_request_stop

  - platform: template
    name: "Следующая радиостанция 62"
    id: radio_next_button
    on_press:
      - script.execute: radio_next

  - platform: template
    name: "Предыдущая радиостанция 63"
    id: radio_previous_button
    on_press:
      - script.execute: radio_previous

esphome:
  includes:
    - radio_station_store.h
  on_boot:
    priority: -90
    then:
      - script.execute: radio_bootstrap

switch:
  - platform: template
    id: radio_station_1_enabled
    name: "Радиостанция 1 — включена"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: radio_station_settings_changed
    turn_off_action:
      - script.execute: radio_station_settings_changed

  - platform: template
    id: radio_station_2_enabled
    name: "Радиостанция 2 — включена"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: radio_station_settings_changed
    turn_off_action:
      - script.execute: radio_station_settings_changed

  - platform: template
    id: radio_station_3_enabled
    name: "Радиостанция 3 — включена"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: radio_station_settings_changed
    turn_off_action:
      - script.execute: radio_station_settings_changed

  - platform: template
    id: radio_station_4_enabled
    name: "Радиостанция 4 — включена"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: radio_station_settings_changed
    turn_off_action:
      - script.execute: radio_station_settings_changed

  - platform: template
    id: radio_station_5_enabled
    name: "Радиостанция 5 — включена"
    optimistic: true

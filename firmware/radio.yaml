# Автономное интернет-радио для ESP32-S3 Smart Speaker.
#
# Подключение из основной конфигурации:
#
# packages:
#   radio: !include radio.yaml
#
# Пакет ожидает:
# - speaker id: voice_speaker
# - scripts from state-machine.yaml:
#     sm_set_radio_source
#     sm_playback_started
#     sm_playback_failed
#     sm_route_stop
# - globals from state-machine.yaml:
#     sm_playback_source
#     sm_next_requested
#     sm_previous_requested
#     sm_stop_requested
#
# Шесть слотов станций хранятся отдельными text/switch entities во flash-памяти
# контроллера и редактируются через встроенный веб-сервер ESPHome. Значения
# initial_value являются первичной предзагрузкой при первом запуске, а
# restore_value сохраняет последующие изменения во flash.
# Для первой версии используются прямые MP3-потоки по HTTP/HTTPS.

globals:
  - id: radio_current_station
    type: int
    restore_value: yes
    initial_value: "0"

  - id: radio_station_count
    type: int
    restore_value: no
    initial_value: "0"

  - id: radio_current_station_url
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: radio_failed_attempts
    type: int
    restore_value: no
    initial_value: "0"

  - id: radio_connecting
    type: bool
    restore_value: no
    initial_value: "false"

  - id: radio_connect_deadline
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # true suppresses the idle callback caused by an intentional stop.
  - id: radio_stop_expected
    type: bool
    restore_value: no
    initial_value: "true"

  - id: radio_paused
    type: bool
    restore_value: no
    initial_value: "false"

text_sensor:
  - platform: template
    id: radio_current_station_name
    name: "Текущая радиостанция 30"
    update_interval: never

  - platform: template
    id: radio_status
    name: "Состояние радио 31"
    update_interval: never


# Умная колонка ESP32-S3
#
# Основная прошивка проекта.
# Все изменяемые GPIO находятся в блоке «КАРТА GPIO ПРОЕКТА» ниже.
#
# Проект рассчитан на:
# - ESP32-S3 N16R8
# - INMP441
# - MAX98357A + динамик 4 Ом / 5 Вт
# - встроенный слот microSD
# - WS2812, 8 светодиодов
# - BQ25895 с I2C
# - четыре емкостные кнопки
#
# Важно:
# Этот файл содержит аппаратный каркас, диагностику и локальные органы
# управления. Радио, MP3-движок, локальные модели команд и manifest-файлы
# microWakeWord подключаются поверх него отдельными компонентами проекта.

substitutions:
  device_name: esp32-s3-smart-speaker
  friendly_name: Умная колонка ESP32-S3
  
  # Собираем путь из двух частей, чтобы парсер не обрезал спецсимволы:
  git_base: "https://github.com"
  audio_lib_url: "ESP32-audioI2S=${git_base}/schreibfaul1/ESP32-audioI2S.git#3.4.7"

  # ============================================================
  # КАРТА GPIO ПРОЕКТА — МЕНЯТЬ GPIO ТОЛЬКО В ЭТОМ БЛОКЕ
  # ============================================================

  # Емкостные датчики:
  # T1/GPIO1  — микрофон
  # T6/GPIO6  — пауза
  # T4/GPIO4  — громче
  # T5/GPIO5  — тише
  #
  # GPIO2/T2 помечен LED_ON на схеме платы, поэтому сенсор паузы перенесён
  # на свободный touch-вывод GPIO6/T6. GPIO3 остаётся неиспользуемым.
  touch_mic: GPIO1
  touch_pause: GPIO6
  touch_plus: GPIO4
  touch_minus: GPIO5

  # Двунаправленная шина I2S:
  # Общие BCLK и WS, отдельные линии данных микрофона и усилителя.
  i2s_bclk: GPIO41
  i2s_ws: GPIO42
  i2s_mic_data: GPIO43
  i2s_speaker_data: GPIO44
  i2s_bclk_num: "41"
  i2s_ws_num: "42"
  i2s_speaker_data_num: "44"

  # WS2812, 8 светодиодов.
  ws2812_data: GPIO21

# BQ25895 I2C.
  i2c_sda: GPIO15
  i2c_scl: GPIO16

  # ============================================================
  # РЕЗЕРВИРОВАННЫЕ ВЫВОДЫ — НЕ НАЗНАЧАТЬ ДРУГИМ КОМПОНЕНТАМ
  # ============================================================

  # OPI PSRAM ESP32-S3 N16R8:
  # GPIO26-GPIO37 — заняты PSRAM.
  #
  # Встроенная microSD, SDMMC 1 бит:
  # GPIO38 — SD_CMD
  # GPIO39 — SD_CLK
  # GPIO40 — SD_DATA0
  sd_cmd: GPIO38
  sd_clk: GPIO39
  sd_data0: GPIO40
  #
  # USB:
  # GPIO19 — USB_D-
  # GPIO20 — USB_D+
  #
  # Загрузочные выводы:
  # GPIO0, GPIO3, GPIO45, GPIO46
  #
  # UART0:
  # GPIO43 — U0TXD
  # GPIO44 — U0RXD
  # Эти выводы используются для данных I2S, поэтому UART-лог отключён.

# SDMMC и web-файловый сервер не входят в базовый набор ESPHome.
# Версия зафиксирована, чтобы обновление ветки main не ломало прошивку.
external_components:
  - source:
      type: git
      url: https://github.com/n-serrette/esphome_sd_card
      ref: v0.2.0
    components:
      - sd_mmc_card
      - sd_file_server
  - source:
      type: local
      path: components
    components:
      - esp_dsp
      - bq25895

packages:
  state_machine: !include state-machine.yaml
  sd_player: !include sd-player.yaml
  radio: !include radio.yaml
  battery: !include battery.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.7.0
  # СЮДА СОБИРАЕМ ВСЕ ХЕДЕРЫ ПРОЕКТА:
  includes:
    - sd_player.h
  # ДОБАВИЛИ ДВЕ СТРОЧКИ НИЖЕ ДЛЯ СКАЧИВАНИЯ ДВИЖКА ПЛЕЕРА:
  libraries:
    - ${audio_lib_url}
  platformio_options:
    build_flags:
      - -DCORE_DEBUG_LEVEL=0     

  on_boot:
    priority: -100
    then:
      - logger.log: "Умная колонка ESP32-S3 запущена"
      - light.turn_off: status_ring
            # ДОБАВИЛИ ДВЕ СТРОЧКИ НИЖЕ ДЛЯ ИНИЦИАЛИЗАЦИИ ПЛЕЕРА:
      - lambda: |-
          my_sd_player = new SdPlayer();
          my_sd_player->begin(41, 42, 44);
      - script.execute: sd_bootstrap
      - delay: 2s
      - if:
          condition:
            lambda: return !id(microphone_privacy);
          then:
            - script.execute: sm_restore_idle_wake_word

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    # ESP32-audioI2S is an Arduino library and requires Arduino.h.
    type: arduino
    advanced:
      include_builtin_idf_components:
        - fatfs
        - spiffs
      disable_vfs_support_termios: false
      disable_vfs_support_select: false
      disable_vfs_support_dir: false
    sdkconfig_options:
      CONFIG_FATFS_LFN_STACK: "y"    
  partitions: huge_app.csv

psram:
  mode: octal
  speed: 80MHz

esp_dsp:

# GPIO43/GPIO44 заняты I2S DATA.
logger:
  baud_rate: 0

wifi:
  power_save_mode: none
  # Потеря Wi‑Fi не должна перезапускать ESP32: SD-плеер должен продолжать
  # работать автономно. Состояние сети сверяется state machine раз в 5 минут.
  reboot_timeout: 0s
  # Сети не зашиваются в прошивку. ESPHome сохраняет настроенную сеть во
  # flash через captive portal, а при потере подключения поднимает fallback AP.
  # В обычной сети веб-панель доступна также по mDNS:
  # http://esp32-s3-smart-speaker.local:8080/
  ap:
    ssid: "${friendly_name} Fallback"
    # Для прототипа используется тот же секрет, что и для OTA и веб-панели.
    password: !secret speaker_ota_password

captive_portal:

mdns:

deep_sleep:
  id: battery_shutdown_sleep
  # У колонки нет физической кнопки пробуждения. Периодическое пробуждение
  # нужно, чтобы заметить питание после глубокого разряда или долгого хранения.
  sleep_duration: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP адрес Wi-Fi"
      id: wifi_ip_address
    ssid:
      name: "Имя сети Wi-Fi"

api:
  encryption:
    key: !secret speaker_api_key

ota:
  - platform: esphome
    password: !secret speaker_ota_password

# Встроенная веб-панель ESPHome используется как первый диагностический
# интерфейс. Позже приложение будет вызывать те же сущности через API.
web_server:
  # Порт 80 оставлен captive portal для настройки Wi-Fi через fallback AP.
  # Веб-панель управления доступна отдельно на 8080.
  port: 8080
  version: 3
  auth:
    username: admin
    password: !secret speaker_ota_password

sd_mmc_card:
  id: sd_card
  mode_1bit: true
  clk_pin: ${sd_clk}
  cmd_pin: ${sd_cmd}
  data0_pin: ${sd_data0}

sd_file_server:
  id: sd_file_browser
  url_prefix: file
  root_path: "/"
  enable_deletion: true
  enable_download: true
  enable_upload: true

i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: true
  frequency: 100kHz

esp32_touch:
  setup_mode: false
  measurement_duration: 8ms
  sleep_duration: 27ms

# Одна двунаправленная шина I2S:
# - RX: INMP441
# - TX: MAX98357A
i2s_audio:
  - id: audio_bus
    i2s_bclk_pin: ${i2s_bclk}
    i2s_lrclk_pin: ${i2s_ws}

microphone:
  - platform: i2s_audio
    id: voice_mic
    i2s_audio_id: audio_bus
    adc_type: external
    i2s_din_pin: ${i2s_mic_data}
    pdm: false
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit

speaker:
  - platform: i2s_audio
    id: voice_speaker
    i2s_audio_id: audio_bus
    dac_type: external
    i2s_dout_pin: ${i2s_speaker_data}
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit

# Локальные модели должны быть доступны всегда. Первая модель — «Скади»;
# остальные включаются каркасом состояний только на время локального окна команд.
micro_wake_word:
  id: local_wake_words
  microphone:
    microphone: voice_mic
    channels: 0
  stop_after_detection: true
  task_stack_in_psram: true
  models:
    - model: micro-wake-word/models/skadi.json
      id: wake_word_skadi
    - model: micro-wake-word/models/radio.json
      id: wake_word_radio
    - model: micro-wake-word/models/pamyat.json
      id: wake_word_pamyat
    - model: micro-wake-word/models/nazad.json
      id: wake_word_nazad
    - model: micro-wake-word/models/dalshe.json
      id: wake_word_dalshe
    - model: micro-wake-word/models/gromche.json
      id: wake_word_gromche
    - model: micro-wake-word/models/tishe.json
      id: wake_word_tishe
    - model: micro-wake-word/models/stop.json
      id: wake_word_stop
  on_wake_word_detected:
    - script.execute:
        id: sm_handle_wake_word
        wake_word: !lambda "return wake_word;"

# Голосовой pipeline Home Assistant запускается, когда сервер доступен.
voice_assistant:
  id: home_assistant_voice
  microphone: voice_mic
  speaker: voice_speaker
  micro_wake_word: local_wake_words
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 1.0

  on_start:
    - script.execute: listening_indicator
    - script.execute: sm_publish_states
  on_end:
    - script.execute: restore_playback_indicator
    - script.execute: sm_voice_session_finished
  on_error:
    - script.execute: error_indicator
    - script.execute: sm_voice_remote_failed
  on_client_connected:
    - logger.log: "Голосовой клиент Home Assistant подключён"
  on_client_disconnected:
    - logger.log: "Голосовой клиент Home Assistant отключён"
    - if:
        condition:
          lambda: return id(sm_voice_state) == 2;
        then:
          - script.execute: sm_voice_remote_failed

light:
  - platform: esp32_rmt_led_strip
    id: status_ring
    name: "Кольцо состояния"
    pin: ${ws2812_data}
    num_leds: 8
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF

globals:
  - id: diagnostics_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: microphone_privacy
    type: bool
    restore_value: yes
    initial_value: "false"

script:
  - id: listening_indicator
    mode: restart
    then:
      - light.turn_on:
          id: status_ring
          red: 62%
          green: 0%
          blue: 100%
          brightness: 55%
          transition_length: 250ms

  - id: ha_indicator
    mode: restart
    then:
      - light.turn_on:
          id: status_ring
          red: 0%
          green: 35%
          blue: 100%
          brightness: 55%
          transition_length: 250ms

  - id: restore_playback_indicator
    mode: restart
    then:
      - light.turn_off:
          id: status_ring
          transition_length: 400ms

  - id: error_indicator
    mode: restart
    then:
      - repeat:
          count: 3
          then:
            - light.turn_on:
                id: status_ring
                red: 100%
                green: 0%
                blue: 0%
                brightness: 80%
                transition_length: 120ms
            - delay: 180ms
            - light.turn_off:
                id: status_ring
                transition_length: 120ms
            - delay: 140ms

  - id: diagnostics_led_test
    mode: restart
    then:
      - light.turn_on:
          id: status_ring
          red: 100%
          green: 0%
          blue: 0%
          brightness: 35%
          transition_length: 150ms
      - delay: 250ms
      - light.turn_on:
          id: status_ring
          red: 100%
          green: 55%
          blue: 0%
          brightness: 45%
          transition_length: 150ms
      - delay: 250ms
      - light.turn_on:
          id: status_ring
          red: 0%
          green: 100%
          blue: 0%
          brightness: 55%
          transition_length: 150ms
      - delay: 250ms
      - light.turn_on:
          id: status_ring
          red: 0%
          green: 35%
          blue: 100%
          brightness: 65%
          transition_length: 150ms
      - delay: 250ms
      - light.turn_on:
          id: status_ring
          red: 62%
          green: 0%
          blue: 100%
          brightness: 70%
          transition_length: 150ms
      - delay: 250ms
      - light.turn_off:
          id: status_ring
          transition_length: 300ms

  - id: enter_diagnostics
    mode: single
    then:
      - lambda: |-
          id(diagnostics_active) = true;
      - logger.log: "Диагностический режим включён"
      - script.execute: diagnostics_led_test

  - id: exit_diagnostics
    mode: single
    then:
      - lambda: |-
          id(diagnostics_active) = false;
      - logger.log: "Диагностический режим выключен"
      - light.turn_off: status_ring

  - id: toggle_microphone_privacy
    mode: single
    then:
      - lambda: |-
          id(microphone_privacy) = !id(microphone_privacy);
      - if:
          condition:
            lambda: return id(microphone_privacy);
          then:
            - voice_assistant.stop:
            - micro_wake_word.stop:
            - script.execute: sm_restore_idle_wake_word
            - light.turn_on:
                id: status_ring
                red: 100%
                green: 0%
                blue: 0%
                brightness: 25%
                transition_length: 250ms
            - logger.log: "Приватность микрофона включена"
          else:
            - script.execute: sm_restore_idle_wake_word
            - light.turn_off:
                id: status_ring
                transition_length: 250ms
            - logger.log: "Приватность микрофона выключена"

  - id: touch_mic_gesture
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: return !id(touch_pause).state;
          then:
            - script.execute: toggle_microphone_privacy

  # Короткое касание меняет громкость, удержание переключает источник.
  # Это позволяет получить «назад/дальше» без дополнительных GPIO.
  - id: touch_plus_gesture
    mode: restart
    then:
      - delay: 650ms
      - if:
          condition:
            lambda: return id(touch_plus).state;
          then:
            - script.execute: sm_route_next
          else:
            - script.execute: sm_volume_up

  - id: touch_minus_gesture
    mode: restart
    then:
      - delay: 650ms
      - if:
          condition:
            lambda: return id(touch_minus).state;
          then:
            - script.execute: sm_route_previous
          else:
            - script.execute: sm_volume_down

  - id: touch_pause_gesture
    mode: restart
    then:
      - delay: 900ms
      - if:
          condition:
            lambda: |-
              return id(touch_pause).state && !id(touch_mic).state;
          then:
            - script.execute: sm_toggle_playback_source
          else:
            - if:
                condition:
                  lambda: return !id(touch_mic).state && !id(diagnostics_active);
                then:
                  - script.execute: sm_route_pause

binary_sensor:
  - platform: status
    name: "Колонка в сети"

  - platform: esp32_touch
    id: touch_mic
    name: "Сенсор микрофона"
    pin: ${touch_mic}
    threshold: 1000
    on_press:
      - script.execute: touch_mic_gesture

  - platform: esp32_touch
    id: touch_pause
    name: "Сенсор паузы"
    pin: ${touch_pause}
    threshold: 1000
    on_press:
      - script.execute: touch_pause_gesture

  - platform: esp32_touch
    id: touch_plus
    name: "Сенсор громкости 1 — увеличить"
    pin: ${touch_plus}
    threshold: 1000
    on_press:
      - script.execute: touch_plus_gesture

  - platform: esp32_touch
    id: touch_minus
    name: "Сенсор громкости 2 — уменьшить"
    pin: ${touch_minus}
    threshold: 1000
    on_press:
      - script.execute: touch_minus_gesture

  # Диагностика: одновременное удержание микрофона и паузы 5 секунд.
  - platform: template
    id: diagnostics_combo
    name: "Комбинация сенсоров диагностики"
    lambda: |-
      return id(touch_mic).state && id(touch_pause).state;
    filters:
      - delayed_on: 5s
    on_press:
      - if:
          condition:
            lambda: return id(diagnostics_active);
          then:
            - script.execute: exit_diagnostics
          else:
            - script.execute: enter_diagnostics

button:
  - platform: restart
    name: "Перезапустить колонку 1"

  - platform: template
    name: "Войти в диагностику 2"
    on_press:
      - script.execute: enter_diagnostics

  - platform: template
    name: "Выйти из диагностики 3"
    on_press:
      - script.execute: exit_diagnostics

  - platform: template
    name: "Проверить светодиоды 4"
    on_press:
      - script.execute: diagnostics_led_test

  - platform: template
    name: "Переключить приватность микрофона 5"
    on_press:
      - script.execute: toggle_microphone_privacy

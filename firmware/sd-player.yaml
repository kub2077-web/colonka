# SD-плеер для ESP32-S3 Smart Speaker.
#
# Подключение из основной конфигурации:
#
# packages:
#   state_machine: !include state-machine.yaml
#   sd_player: !include sd-player.yaml
#
# Контракт:
# - sd_card — уже смонтированная sd_mmc_card;
# - sm_set_sd_source, sm_playback_started, sm_playback_failed,
#   sm_route_next, sm_route_previous, sm_route_stop — из state-machine.yaml;
# - GPIO для общего I2S-выхода задаются в основном YAML.
#
# Используется ESP32-audioI2S 3.4.7. Библиотека сама декодирует MP3 и
# отправляет PCM через тот же BCLK/LRCLK/DOUT, что и MAX98357A. Для ESP32-S3
# библиотека использует I2S1, а голосовой bus ESPHome остаётся на I2S0.

# Объявляем реальное физическое хранилище для нашего внешнего указателя C++

globals:
  - id: sd_start_result
    type: bool
    restore_value: no
    initial_value: "false"

  - id: sd_player_active
    type: bool
    restore_value: no
    initial_value: "false"

text_sensor:
  - platform: template
    id: sd_current_track
    name: "Текущий трек SD 20"
    update_interval: never

  - platform: template
    id: sd_track_list
    name: "Список треков SD 21"
    update_interval: never

  - platform: template
    id: sd_status
    name: "Состояние SD-плеера 22"
    update_interval: never

  - platform: template
    id: sd_recent_history
    name: "История треков SD 23"
    update_interval: never

sensor:
  - platform: template
    id: sd_track_count
    name: "Количество MP3 на SD 40"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: sd_track_number
    name: "Номер трека SD 41"
    accuracy_decimals: 0
    update_interval: never

switch:
  - platform: template
    id: sd_shuffle
    name: "Перемешивание SD 42"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - if:
          condition:
            lambda: return my_sd_player != nullptr;
          then:
            - lambda: my_sd_player->set_shuffle(true);
      - script.execute: sd_publish_library
    turn_off_action:
      - if:
          condition:
            lambda: return my_sd_player != nullptr;
          then:
            - lambda: my_sd_player->set_shuffle(false);
      - script.execute: sd_publish_library

script:
  - id: sd_publish_status
    mode: restart
    parameters:
      state: string
    then:
      - text_sensor.template.publish:
          id: sd_status
          state: !lambda "return state;"

  - id: sd_publish_library
    mode: restart
    then:
      - if:
          condition:
            lambda: return my_sd_player != nullptr;
          then:
            - lambda: |-
                auto *player = my_sd_player;
                id(sd_track_count).publish_state(player->track_count());
                id(sd_track_number).publish_state(
                    player->track_count() == 0 ? 0 : player->current_index() + 1);
                id(sd_current_track).publish_state(player->current_name());
                id(sd_track_list).publish_state(player->playlist());
                id(sd_recent_history).publish_state(player->recent_history());

  - id: sd_scan
    mode: restart
    then:
      - if:
          condition:
            lambda: return my_sd_player != nullptr;
          then:
            - lambda: |-
                const bool mounted = my_sd_player->scan();
                id(sd_start_result) = mounted;
            - script.execute: sd_publish_library
            - if:
                condition:
                  lambda: return id(sd_start_result);
                then:
                  - script.execute:
                      id: sd_publish_status
                      state: "Остановлено"
                else:
                  - script.execute:
                      id: sd_publish_status
                      state: "Ошибка: SD-карта недоступна"

  - id: sd_apply_stop
    mode: restart
    then:
      - if:
          condition:
            lambda: return my_sd_player != nullptr;
          then:
            - lambda: |-
                my_sd_player->stop();
                id(sd_player_active) = false;
                if (id(sm_audio_owner) == 2) {
                  id(sm_audio_owner) = 0;
                }
      - lambda: id(sm_stop_requested) = false;
      - script.execute:
          id: sd_publish_status
          state: "Остановлено"

  - id: sd_on_failed
    mode: restart
    then:
      - lambda: |-
          id(sd_player_active) = false;
          if (id(sm_audio_owner) == 2) {
            id(sm_audio_owner) = 0;
          }
      - script.execute: sm_playback_failed
      - script.execute:
          id: sd_publish_status
          state: "Ошибка"

  - id: sd_on_started
    mode: restart
    then:
      - lambda: id(sd_player_active) = true;
      - script.execute: sm_playback_started
      - script.execute:
          id: sd_publish_status
          state: "Воспроизводится"
      - script.execute: sd_publish_library

  - id: sd_start
    mode: restart
    then:
      - script.execute:
          id: sm_audio_acquire
          requested_owner: 2
      - script.execute: sm_set_sd_source
      - script.execute:
          id: sd_set_volume
          volume: !lambda "return id(sm_volume_level);"
      - if:
          condition:
            lambda: return my_sd_player != nullptr;
          then:
            - lambda: |-
                auto *player = my_sd_player;
                if (player->track_count() == 0) {
                  player->scan();
                }
                id(sd_start_result) = player->start();
            - script.execute: sd_publish_library
            - if:
                condition:
                  lambda: return id(sd_start_result);
                then:
                  - script.execute:
                      id: sd_publish_status
                      state: "Запуск"
                else:
                  - script.execute: sd_on_failed
          else:
            - script.execute: sd_on_failed

  - id: sd_pause
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return my_sd_player != nullptr &&
                     my_sd_player->active();
          then:
            - lambda: my_sd_player->pause_resume();
            - if:
                condition:
                  lambda: return my_sd_player->paused();
                then:
                  - script.execute: sm_playback_paused
                  - script.execute:
                      id: sd_publish_status
                      state: "Пауза"
                else:
                  - script.execute: sm_playback_started
                  - script.execute:
                      id: sd_publish_status
                      state: "Воспроизводится"

  - id: sd_set_volume
    mode: restart
    parameters:
      volume: float
    then:
      - if:
          condition:
            lambda: return my_sd_player != nullptr;
          then:
            - lambda: my_sd_player->set_volume(volume);

  - id: sd_next
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(sm_playback_source) == 2;
          then:
            - if:
                condition:
                  lambda: |-
                    return my_sd_player != nullptr &&
                           my_sd_player->next();
                then:
                  - script.execute:
                      id: sd_publish_status
                      state: "Запуск"
                else:
                  - script.execute: sd_on_failed

  - id: sd_previous
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(sm_playback_source) == 2;
          then:
            - if:
                condition:
                  lambda: |-
                    return my_sd_player != nullptr &&
                           my_sd_player->previous();
                then:
                  - script.execute:
                      id: sd_publish_status
                      state: "Запуск"
                else:
                  - script.execute: sd_on_failed

  - id: sd_consume_router_requests
    mode: restart
    then:
      # Источник сменился на радио, голос или другой модуль.
      - if:
          condition:
            lambda: |-
              return id(sd_player_active) &&
                     id(sm_playback_source) != 2;
          then:
            - script.execute: sd_apply_stop
      - if:
          condition:
            lambda: return id(sm_playback_source) == 2 && id(sm_next_requested);
          then:
            - lambda: id(sm_next_requested) = false;
            - script.execute: sd_next
      - if:
          condition:
            lambda: |-
              return id(sm_playback_source) == 2 && id(sm_previous_requested);
          then:
            - lambda: id(sm_previous_requested) = false;
            - script.execute: sd_previous
      - if:
          condition:
            lambda: return id(sm_playback_source) == 2 && id(sm_stop_requested);
          then:
            - script.execute: sd_apply_stop

  - id: sd_bootstrap
    mode: restart
    then:
      - script.execute: sd_scan
      - script.execute:
          id: sd_publish_status
          state: "Остановлено"

interval:
  - interval: 10ms
    then:
      - if:
          condition:
            lambda: return my_sd_player != nullptr;
          then:
            - lambda: |-
                auto *player = my_sd_player;
                player->loop();
                if (player->take_started_event()) {
                  id(sd_on_started).execute();
                }
                if (player->take_failed_event()) {
                  id(sd_on_failed).execute();
                }
      - script.execute: sd_consume_router_requests

button:
  - platform: template
    id: sd_start_button
    name: "Запустить SD-плеер 50"
    on_press:
      - script.execute: sd_start

  - platform: template
    id: sd_pause_button
    name: "Пауза SD-плеера 51"
    on_press:
      - script.execute: sd_pause

  - platform: template
    id: sd_stop_button
    name: "Остановить SD-плеер 52"
    on_press:
      - script.execute: sm_route_stop

  - platform: template
    id: sd_next_button
    name: "Следующий трек SD 53"
    on_press:
      - script.execute: sm_route_next

  - platform: template
    id: sd_previous_button
    name: "Предыдущий трек SD 54"
    on_press:
      - script.execute: sm_route_previous

  - platform: template
    id: sd_rescan_button
    name: "Пересканировать SD 55"
    on_press:
      - script.execute: sd_scan

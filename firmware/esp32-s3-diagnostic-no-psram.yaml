# Minimal ESPHome image to compare startup with external PSRAM disabled.
# Keep separate from the speaker firmware and the PSRAM-enabled diagnostic.
esphome:
  name: esp32-s3-startup-no-psram
  friendly_name: ESP32-S3 No-PSRAM Diagnostic
  min_version: 2025.7.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  flash_frequency: 40MHz
  partitions: huge_app.csv
  framework:
    type: arduino
    sdkconfig_options:
      CONFIG_SPIRAM: "n"

logger:
  level: VERY_VERBOSE
  hardware_uart: UART0
  baud_rate: 115200

# UART0 uses GPIO43/44 on ESP32-S3. No audio components are included here,
# so these pins remain available for the USB-UART connector.
interval:
  - interval: 2s
    then:
      - lambda: |-
          ESP_LOGI(
            "diag",
            "DIAG_ALIVE_NO_PSRAM uptime=%lu s heap_free=%u",
            static_cast<unsigned long>(millis() / 1000U),
            static_cast<unsigned>(ESP.getFreeHeap()));

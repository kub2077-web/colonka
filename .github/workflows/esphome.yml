name: Compile ESPHome
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: |
          pip install esphome

      - name: Compile Firmware
        working-directory: firmware
        run: |
          esphome compile esp32-s3-smart-speaker.yaml

      # НОВЫЙ НАДЕЖНЫЙ ШАГ: Вытаскиваем бинарник из скрытых папок в корень
      - name: Locate and Copy Binary
        if: always()
        run: |
          find firmware/ -name "*.bin" -exec cp {} firmware/firmware.bin \; 2>/dev/null || true

      - name: Upload Firmware and Source Code
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp-project-files
          path: |
            firmware/firmware.bin
            firmware/.esphome/build/*/src/main.cpp

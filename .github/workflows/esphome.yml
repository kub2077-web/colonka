name: Compile ESPHome
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: |
          pip install esphome

      - name: Compile Firmware
        # Указываем GitHub, что работать нужно внутри папки firmware
        working-directory: firmware
        run: |
          esphome compile esp32-s3-speaker.yaml

      - name: Upload Firmware and Source Code
        uses: actions/upload-artifact@v4
        if: always() # Важно! Этот флаг заставит GitHub выдать файлы, даже если компиляция упала с ошибкой
        with:
          name: esp-project-files
          path: |
            firmware/.esphome/build/*/.pioenvs/*/firmware.bin
            firmware/.esphome/build/*/src/main.cpp

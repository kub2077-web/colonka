name: Compile ESPHome diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO and pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-esphome-diagnostic-py311-${{ hashFiles('firmware/esp32-s3-diagnostic.yaml', 'firmware/huge_app.csv') }}
          restore-keys: |
            ${{ runner.os }}-esphome-diagnostic-py311-

      - name: Install ESPHome
        run: python -m pip install esphome

      - name: Validate diagnostic configuration
        run: esphome config firmware/esp32-s3-diagnostic.yaml

      - name: Compile diagnostic firmware
        run: esphome compile firmware/esp32-s3-diagnostic.yaml

      - name: Verify build outputs
        run: |
          build_dir="firmware/.esphome/build/esp32-s3-startup-diagnostic"
          find "$build_dir" -type f \( -name "*.bin" -o -name "*.elf" -o -name "*.map" \) -print

          for extension in bin elf map; do
            if ! find "$build_dir" -type f -name "*.$extension" -print -quit | grep -q .; then
              echo "::error::ESPHome did not produce a .$extension file"
              exit 1
            fi
          done

      - name: Upload diagnostic firmware and symbols
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-diagnostic-${{ github.sha }}
          path: |
            firmware/.esphome/build/esp32-s3-startup-diagnostic/**/*.bin
            firmware/.esphome/build/esp32-s3-startup-diagnostic/**/*.elf
            firmware/.esphome/build/esp32-s3-startup-diagnostic/**/*.map
            firmware/.esphome/build/esp32-s3-startup-diagnostic/**/main.cpp
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
